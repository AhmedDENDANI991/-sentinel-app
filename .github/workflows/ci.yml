# ============================================================================
# GENIE_CIVIL_AI — CI (version simplifiée et autonome)
# N'utilise QUE des actions GitHub officielles (checkout / setup-node /
# setup-python). pnpm est activé via corepack (intégré à Node), donc aucune
# action tierce du Marketplace n'est requise — utile si le runner ne peut pas
# télécharger d'actions externes.
# ============================================================================
name: ci

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-calc:
    name: Calc engine (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/workers/svc-calcul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - run: pytest --cov=genie_calc --cov-report=term-missing

  node:
    name: Web/API (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # pnpm via corepack — pas d'action Marketplace
      - run: corepack enable && corepack prepare pnpm@10.0.0 --activate
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build

  security:
    name: Security (secret scan + audits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (sans dépendance)
        run: bash scripts/secret-scan.sh
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: pip-audit (non bloquant)
        run: pip install pip-audit && pip-audit -r apps/workers/svc-calcul/pyproject.toml || true
